name: Main

# Everything that happens when `main` moves: the checks run, then Changesets
# either opens the "Version Packages" pull request (when changesets are
# pending) or, once that PR is merged, publishes to npm and cuts the GitHub
# release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  # The action pushes the version PR branch and creates releases.
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC).
  id-token: write

jobs:
  main:
    name: Check and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Third-party action, so pinned to a SHA rather than a moving tag.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      # The capture smoke test drives the runner's preinstalled Chrome
      # through Bun.WebView's CDP backend.
      - name: Test
        run: bun test

      # npm speaks OIDC trusted publishing; a token publish would answer with
      # a 2FA challenge (`EOTP`) that nobody is there to type. The Changesets
      # CLI also needs Node, since it does not run under Bun.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "Version packages"
          pr-title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
